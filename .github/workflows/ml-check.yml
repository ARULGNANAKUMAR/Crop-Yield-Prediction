name: Crop Yield ML Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ml-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crop Yield ML Pipeline
        run: |
          python "Complete Crop Yield Prediction Pipeline.py"
